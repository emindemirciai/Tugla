name: tugla

x-app-environment: &app-environment
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-Tuğla}
  APP_SLUG: ${APP_SLUG:-tugla}
  ROOT_DOMAIN: ${ROOT_DOMAIN}
  WEB_URL: https://${ROOT_DOMAIN}
  ADMIN_URL: https://admin.${ROOT_DOMAIN}
  API_URL: https://api.${ROOT_DOMAIN}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tugla-postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Tuğla <no-reply@example.com>}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: auto
  S3_BUCKET: tugla
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: 'true'
  ADS_ENABLED: ${ADS_ENABLED:-false}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.${ROOT_DOMAIN}/api
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Tuğla}
        APP_NAME: ${APP_NAME:-Tuğla}
        APP_TAGLINE: ${APP_TAGLINE:-Break the grid}
        WEB_URL: https://${ROOT_DOMAIN}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-tr}
        NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-}
        NEXT_PUBLIC_ANALYTICS_SITE: ${NEXT_PUBLIC_ANALYTICS_SITE:-${ROOT_DOMAIN}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Tuğla}
      APP_TAGLINE: ${APP_TAGLINE:-Break the grid}
      WEB_URL: https://${ROOT_DOMAIN}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-tr}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-true}
      AI_CRAWLERS_ALLOWED: ${AI_CRAWLERS_ALLOWED:-true}
      SOCIAL_TWITTER: ${SOCIAL_TWITTER:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [public, private]

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: https://api.${ROOT_DOMAIN}/api
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Tuğla}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [public, private]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *app-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1400M
    networks: [public, private]

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    command: ['pnpm', '--filter', '@tugla/database', 'migrate']
    environment: *app-environment
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tugla}
      POSTGRES_USER: ${POSTGRES_USER:-tugla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tugla} -d ${POSTGRES_DB:-tugla}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1800M
    networks:
      private:
        aliases:
          - tugla-postgres

  redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '384mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [private]

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [private]

  # Site analytics: the project's own Analyze.Your.Site dashboard.
  # Give it its own domain (e.g. analiz.${ROOT_DOMAIN}) in Dokploy.
  analytics:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.analytics
      args:
        ANALYTICS_REPO: ${ANALYTICS_REPO:-https://github.com/emindemirciai/Analyze.Your.Site-Siteni-Analiz-Et-.git}
        ANALYTICS_REF: ${ANALYTICS_REF:-main}
    environment:
      # Only the player site may post events; the tracker script is public.
      ANALYZE_ALLOWED_ORIGIN: ${WEB_URL:-https://${ROOT_DOMAIN}}
      ANALYZE_DATA_DIR: /data
      ANALYZE_MAX_EVENTS: ${ANALYTICS_MAX_EVENTS:-20000}
    volumes:
      - analytics_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [public]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  analytics_data:

networks:
  public:
  private:
    internal: true

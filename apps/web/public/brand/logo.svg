<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Tuğla">
  <title>Tuğla</title>
  <!--
    The mark is the game itself: three courses of brick with one course broken
    open, and the ball punching through the gap. The dot doubles as the "pulse"
    of the interface, so the logo and the UI share one idea.
  -->
  <defs>
    <linearGradient id="tuglaBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6bff" />
      <stop offset="0.55" stop-color="#5b4be1" />
      <stop offset="1" stop-color="#ff7a45" />
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="26" fill="url(#tuglaBrand)" />
  <g fill="#ffffff">
    <!-- top course: intact -->
    <rect x="18" y="24" width="26" height="11" rx="3.5" opacity="0.95" />
    <rect x="48" y="24" width="30" height="11" rx="3.5" opacity="0.95" />
    <!-- middle course: broken open, the ball is on its way through -->
    <rect x="18" y="41" width="14" height="11" rx="3.5" opacity="0.6" />
    <rect x="64" y="41" width="14" height="11" rx="3.5" opacity="0.6" />
    <!-- bottom course: the paddle line -->
    <rect x="30" y="72" width="36" height="8" rx="4" opacity="0.95" />
  </g>
  <circle cx="48" cy="46.5" r="8.5" fill="#ffd166" />
  <circle cx="48" cy="46.5" r="8.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />
</svg>

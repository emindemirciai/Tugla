<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Tuğla — modern tuğla kırma oyunu">
  <title>Tuğla — tugla.fun</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="0.6" stop-color="#ece8ff"/>
      <stop offset="1" stop-color="#ffe6d9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6bff"/>
      <stop offset="0.55" stop-color="#5b4be1"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2154"/>
      <stop offset="1" stop-color="#171034"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4be1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b4be1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#paper)"/>
  <circle cx="70" cy="40" r="130" fill="url(#glow)"/>

  <!-- lockup -->
  <g transform="translate(20 26)">
    <rect width="40" height="40" rx="11" fill="url(#mark)"/>
    <g fill="#ffffff" transform="scale(0.4167)">
      <rect x="18" y="24" width="26" height="11" rx="3.5" opacity="0.95"/>
      <rect x="48" y="24" width="30" height="11" rx="3.5" opacity="0.95"/>

    <text x="20" y="140" font-size="26" font-weight="800" letter-spacing="-0.7" fill="#1b1533">Tuğlaları kır.</text>
    <text x="20" y="175" font-size="26" font-weight="800" letter-spacing="-0.7" fill="#5b4be1">Fırtınayı çoğalt.</text>
    <text x="20" y="199" font-size="12" fill="#423a63">Ücretsiz. Tarayıcıda oynanır.</text>

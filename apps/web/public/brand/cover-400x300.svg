<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Tuğla.fun — modern tuğla kırma oyunu">
  <title>Tuğla.fun</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="0.6" stop-color="#ece8ff"/>
      <stop offset="1" stop-color="#ffe6d9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6bff"/>
      <stop offset="0.55" stop-color="#5b4be1"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2154"/>
      <stop offset="1" stop-color="#171034"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#paper)"/>

  <!-- lockup, clear of the card badge in the corner -->
  <g transform="translate(22 40)">
    <rect width="30" height="30" rx="9" fill="url(#mark)"/>
    <g fill="#ffffff" transform="scale(0.3125)">
      <rect x="18" y="24" width="26" height="11" rx="3.5" opacity="0.95"/>
      <rect x="48" y="24" width="30" height="11" rx="3.5" opacity="0.95"/>
      <rect x="18" y="41" width="14" height="11" rx="3.5" opacity="0.6"/>
      <rect x="64" y="41" width="14" height="11" rx="3.5" opacity="0.6"/>
      <rect x="30" y="72" width="36" height="8" rx="4" opacity="0.95"/>
      <circle cx="48" cy="46.5" r="8.5" fill="#ffd166"/>
    </g>
    <text x="38" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.6" fill="#1b1533">Tuğla.fun</text>
  </g>

  <!-- message -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="22" y="140" font-size="24" font-weight="800" letter-spacing="-0.7" fill="#1b1533">Tuğlaları kır.</text>
    <text x="22" y="170" font-size="24" font-weight="800" letter-spacing="-0.7" fill="#5b4be1">Fırtınayı çoğalt.</text>
    <text x="22" y="192" font-size="11" fill="#423a63">Ücretsiz · tarayıcıda oynanır</text>
    <g transform="translate(22 205)">
      <rect width="123.2" height="20" rx="10" fill="#ffffff" stroke="#e2daf6"/>
      <text x="61.6" y="13.5" text-anchor="middle" font-size="8" font-weight="700" letter-spacing="0.4" fill="#5b4be1">10 DÜNYA · 500 BÖLÜM</text>
    </g>
  </g>

  <!-- playfield -->
  <g>
    <rect x="264" y="44" width="116" height="196" rx="16" fill="url(#stage)"/>
    <rect x="265" y="45" width="114" height="194" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <text x="275" y="63" font-family="ui-sans-serif, system-ui, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.1" fill="#efe9ff" opacity="0.75">DÜNYA 03</text>
    <text x="369" y="63" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#efe9ff" opacity="0.75">♥ 3</text>
    <rect x="269.0" y="74.0" width="18" height="8" rx="3" fill="#6ad2ff"/>
      <rect x="291.0" y="74.0" width="18" height="8" rx="3" fill="#8b7bff"/>
      <rect x="313.0" y="74.0" width="18" height="8" rx="3" fill="#ff9a6b"/>
      <rect x="335.0" y="74.0" width="18" height="8" rx="3" fill="#4fd6a8"/>
      <rect x="269.0" y="86.0" width="18" height="8" rx="3" fill="#8b7bff"/>
      <rect x="291.0" y="86.0" width="18" height="8" rx="3" fill="#ff9a6b"/>
      <rect x="335.0" y="86.0" width="18" height="8" rx="3" fill="#ffd166"/>
      <rect x="357.0" y="86.0" width="18" height="8" rx="3" fill="#6ad2ff"/>
      <rect x="269.0" y="98.0" width="18" height="8" rx="3" fill="#ff9a6b"/>
      <rect x="335.0" y="98.0" width="18" height="8" rx="3" fill="#6ad2ff"/>
      <rect x="357.0" y="98.0" width="18" height="8" rx="3" fill="#8b7bff"/>
      <rect x="269.0" y="110.0" width="18" height="8" rx="3" fill="#4fd6a8"/>
      <rect x="291.0" y="110.0" width="18" height="8" rx="3" fill="#ffd166"/>
      <rect x="313.0" y="110.0" width="18" height="8" rx="3" fill="#6ad2ff"/>
      <rect x="335.0" y="110.0" width="18" height="8" rx="3" fill="#8b7bff"/>
      <rect x="357.0" y="110.0" width="18" height="8" rx="3" fill="#ff9a6b"/>
      <rect x="269.0" y="122.0" width="18" height="8" rx="3" fill="#ffd166"/>
      <rect x="291.0" y="122.0" width="18" height="8" rx="3" fill="#6ad2ff"/>
      <rect x="313.0" y="122.0" width="18" height="8" rx="3" fill="#8b7bff"/>
      <rect x="335.0" y="122.0" width="18" height="8" rx="3" fill="#ff9a6b"/>
      <rect x="357.0" y="122.0" width="18" height="8" rx="3" fill="#4fd6a8"/>
    <circle cx="335.9" cy="165.5" r="4" fill="#ffffff"/>
    <circle cx="304.6" cy="185.1" r="3" fill="#ffd166"/>
    <rect x="301.1" y="222.0" width="41.8" height="5" rx="2.5" fill="url(#paddle)"/>
  </g>
</svg>

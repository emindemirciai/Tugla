    <text x="50" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.8" fill="#1b1533">Tuğla</text>
    <text x="51" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2.4" fill="#6a6390">TUGLA.FUN</text>

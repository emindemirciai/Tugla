name: tugla-dev

services:
  postgres:
    image: postgres:17-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_DB: tugla
      POSTGRES_USER: tugla
      POSTGRES_PASSWORD: tugla
    volumes:
      - tugla_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tugla -d tugla']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - tugla_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tugla-local
      MINIO_ROOT_PASSWORD: tugla-local-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - tugla_minio:/data

volumes:
  tugla_postgres:
  tugla_redis:
  tugla_minio:
